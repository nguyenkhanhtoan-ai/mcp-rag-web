{% extends "base.html" %}
{% block title %}Sửa phòng ban{% endblock %}
{% block content %}
<h1>Sửa phòng ban</h1>

<div class="card" style="max-width:420px">
    <form method="post" action="/admin/departments/{{ dept.id }}/edit">
        <label>Tên phòng ban</label>
        <input type="text" name="name" value="{{ dept.name }}" required>

        <div class="row" style="margin-top:8px">
            <button type="submit">Lưu thay đổi</button>
            <a href="/admin/departments" class="page-link">Huỷ</a>
        </div>
    </form>
</div>
{% endblock %}
